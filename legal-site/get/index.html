<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinFindr</title>
    <meta name="description" content="Get FinFindr on the App Store." />
    <meta name="theme-color" content="#d8ebf8" />
    <style>
      :root {
        --ink: #07192b;
        --muted: #4d6478;
        --water: #1f6f97;
        --card: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 42%),
          linear-gradient(180deg, #e8f4fc 0%, #d2e8f7 48%, #c5dff3 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px 32px;
      }

      .card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(7, 25, 43, 0.12);
        padding: 36px 24px 28px;
        text-align: center;
      }

      .icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 14px 30px rgba(7, 25, 43, 0.16);
        margin: 0 auto 16px;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }

      .tagline {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .cta {
        display: inline-block;
        margin-top: 28px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 17px 18px;
        background: linear-gradient(180deg, #0a2742 0%, #07192b 100%);
        color: #fff !important;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(7, 25, 43, 0.22);
        cursor: pointer;
      }

      .cta:active {
        transform: scale(0.98);
      }

      .fine {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/assets/app-icon.png" width="96" height="96" alt="FinFindr app icon" />
      <h1>FinFindr</h1>
      <p class="tagline">Bite forecasts, tackle picks, and Water Read maps.</p>

      <button class="cta" id="open-browser-btn" type="button" hidden>Get FinFindr</button>
      <a class="cta" id="store-cta" href="https://apps.apple.com/app/id6769178136" hidden>
        Download on the App Store
      </a>

      <p class="fine">Free · iPhone · United States</p>
    </main>
    <script>
      (function () {
        var SAFARI_URL = "https://finfindr.app/get?open=store";
        var ua = navigator.userAgent || "";
        var isIOS = /iPad|iPhone|iPod/.test(ua);
        var isTikTok = /tiktok|musical_ly|BytedanceWebview|aweme/i.test(ua);
        var inSafariStep = new URLSearchParams(window.location.search).get("open") === "store";

        var openBrowserBtn = document.getElementById("open-browser-btn");
        var storeCta = document.getElementById("store-cta");

        if (inSafariStep && isIOS && !isTikTok) {
          storeCta.hidden = false;
          return;
        }

        if (isTikTok && isIOS) {
          openBrowserBtn.hidden = false;
          openBrowserBtn.addEventListener("click", function () {
            var bridge = "x-safari-https://" + SAFARI_URL.replace(/^https:\/\//, "");
            window.location.href = bridge;
          });
          return;
        }

        storeCta.hidden = false;
      })();
    </script>
  </body>
</html>
