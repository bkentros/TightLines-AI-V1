<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinFindr</title>
    <meta name="description" content="Get FinFindr on the App Store." />
    <meta name="theme-color" content="#d8ebf8" />
    <style>
      :root {
        --ink: #07192b;
        --muted: #4d6478;
        --water: #1f6f97;
        --card: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 42%),
          linear-gradient(180deg, #e8f4fc 0%, #d2e8f7 48%, #c5dff3 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px 32px;
      }

      .card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(7, 25, 43, 0.12);
        padding: 32px 24px 26px;
        text-align: center;
      }

      .icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 14px 30px rgba(7, 25, 43, 0.16);
        margin: 0 auto 16px;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }

      .tagline {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .cta {
        display: inline-block;
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 17px 18px;
        background: linear-gradient(180deg, #0a2742 0%, #07192b 100%);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(7, 25, 43, 0.22);
        cursor: pointer;
      }

      .cta:active {
        transform: scale(0.98);
      }

      .subcta {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .redirecting {
        margin-top: 18px;
        font-size: 15px;
        color: var(--water);
        font-weight: 600;
      }

      .fallback {
        display: none;
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        background: rgba(31, 111, 151, 0.08);
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
        text-align: left;
      }

      .fallback strong {
        color: var(--ink);
      }

      .fine {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/assets/app-icon.png" width="96" height="96" alt="FinFindr app icon" />
      <h1>FinFindr</h1>
      <p class="tagline">Bite forecasts, tackle picks, and Water Read maps.</p>

      <button class="cta" id="continue-btn" type="button" hidden>Get FinFindr</button>
      <p class="subcta" id="continue-copy" hidden>Opens in your browser, then the App Store.</p>

      <a class="cta" id="store-cta" href="https://apps.apple.com/app/id6769178136" hidden>
        Download on the App Store
      </a>

      <p class="redirecting" id="redirecting" hidden>Opening App Store…</p>

      <p class="fallback" id="fallback">
        Still here? Tap <strong>⋯</strong> (top right) → <strong>Open in browser</strong>. FinFindr opens in the App Store right after.
      </p>

      <p class="fine">Free · iPhone · United States</p>
    </main>
    <script>
      (function () {
        var APP_STORE = "https://apps.apple.com/app/id6769178136";
        var SAFARI_BRIDGE = "https://finfindr.app/get?open=store";
        var ua = navigator.userAgent || "";
        var isIOS = /iPad|iPhone|iPod/.test(ua);
        var isTikTok = /tiktok|musical_ly|BytedanceWebview|aweme/i.test(ua);
        var params = new URLSearchParams(window.location.search);
        var openStore = params.get("open") === "store";

        var continueBtn = document.getElementById("continue-btn");
        var continueCopy = document.getElementById("continue-copy");
        var storeCta = document.getElementById("store-cta");
        var redirecting = document.getElementById("redirecting");
        var fallback = document.getElementById("fallback");

        function showRedirecting() {
          redirecting.hidden = false;
        }

        function openInRealBrowser() {
          // Best-effort iOS escape from TikTok on a direct user tap.
          var safariBridge = "x-safari-https://" + SAFARI_BRIDGE.replace(/^https:\/\//, "");
          window.location.href = safariBridge;
          window.setTimeout(function () {
            window.open(APP_STORE, "_blank");
          }, 350);
          window.setTimeout(function () {
            fallback.style.display = "block";
          }, 1800);
        }

        if (openStore && isIOS && !isTikTok) {
          showRedirecting();
          window.location.replace(APP_STORE);
          return;
        }

        if (isTikTok && isIOS) {
          continueBtn.hidden = false;
          continueCopy.hidden = false;
          continueBtn.addEventListener("click", openInRealBrowser);
          return;
        }

        if (isIOS) {
          showRedirecting();
          window.location.replace(APP_STORE);
          return;
        }

        storeCta.hidden = false;
      })();
    </script>
  </body>
</html>
