<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinFindr · Signing in</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: linear-gradient(180deg, #eaf5fc 0%, #d4e9f7 100%);
      color: #07192b;
    }
    .card {
      width: min(420px, calc(100% - 32px));
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(7,25,43,0.12);
      text-align: center;
    }
    .error { color: #b91c1c; font-size: 14px; margin-top: 12px; }
    a { color: #1f6f97; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <p id="msg">Signing you in…</p>
    <p id="err" class="error hidden"></p>
    <p id="retry" class="hidden"><a href="/creators/">Back to creator portal</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const PORTAL_URL = 'https://finfindr.app/creators/';

    function cleanUrl() {
      window.history.replaceState({}, document.title, '/creators/auth/callback/');
    }

    async function loadConfig() {
      const res = await fetch('/creators/config');
      if (!res.ok) throw new Error('Creator portal is not configured.');
      return res.json();
    }

    async function finishAuth(client) {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));

      const code = query.get('code');
      const tokenHash = query.get('token_hash') || hash.get('token_hash');
      const type = query.get('type') || hash.get('type') || 'magiclink';

      if (code) {
        const { data, error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;
        return data.session;
      }

      if (tokenHash) {
        const { data, error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });
        if (error) throw error;
        return data.session;
      }

      if (hash.get('access_token') && hash.get('refresh_token')) {
        const { data, error } = await client.auth.setSession({
          access_token: hash.get('access_token'),
          refresh_token: hash.get('refresh_token'),
        });
        if (error) throw error;
        return data.session;
      }

      if (hash.get('access_token')) {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        return data.session;
      }

      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      return data.session;
    }

    (async function () {
      const msg = document.getElementById('msg');
      const err = document.getElementById('err');
      const retry = document.getElementById('retry');
      try {
        const cfg = await loadConfig();
        const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
          auth: {
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true,
          },
        });

        const session = await finishAuth(client);
        cleanUrl();
        if (!session) {
          throw new Error('No active session was created from that link. Request a fresh sign-in link from the same browser.');
        }

        msg.textContent = 'Signed in. Opening your dashboard…';
        window.location.replace(PORTAL_URL);
      } catch (e) {
        msg.textContent = 'Could not complete sign-in.';
        err.textContent = e.message || 'The link may have expired.';
        err.classList.remove('hidden');
        retry.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
