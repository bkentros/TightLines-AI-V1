<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinFindr Legal</title>
    <script>
      (function () {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (!search && !hash) return;
        var params = new URLSearchParams(search);
        var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
        var type = (params.get('type') || hashParams.get('type') || '').toLowerCase();
        if (type === 'signup' || type === 'email' || type === 'invite' || type === 'recovery') {
          window.location.replace('/auth/confirm/' + search + hash);
          return;
        }
        var hasAuth = params.get('code') || params.get('token_hash') ||
          hashParams.get('access_token') || hashParams.get('token_hash');
        if (!hasAuth) return;
        window.location.replace('/creators/auth/callback/' + search + hash);
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header>
      <div class="eyebrow">FinFindr</div>
      <h1>Legal.</h1>
      <p class="subtitle">Terms, privacy, support, and safety information for FinFindr LLC.</p>
      <nav aria-label="Site pages">
        <a class="button-link" href="/download/">Download</a>
        <a class="button-link" href="/terms/">Terms of Service</a>
        <a class="button-link" href="/privacy/">Privacy Policy</a>
        <a class="button-link" href="/safety/">Safety Notice</a>
        <a class="button-link" href="/support/">Support</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Contact</h2>
        <p>Questions can be sent to <a href="mailto:support@finfindr.app">support@finfindr.app</a>.</p>
      </section>
    </main>
    <footer>Copyright 2026 FinFindr LLC. All rights reserved.</footer>
  </body>
</html>
