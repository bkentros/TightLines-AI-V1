# Live Lake Map gatekeeper — see worker.js. Deploy from this folder:
#   npx wrangler@4 deploy
# Secret (same value as the Supabase secret PIER_CAST_MAP_PASS_SECRET):
#   npx wrangler@4 secret put MAP_PASS_SECRET
name = "piercast-map-gate"
main = "worker.js"
account_id = "fe7a8d144a9b29b73dd513830858774c"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "map.finfindr.app", custom_domain = true }]

# One collection supplies every edge location and preserves immutable evidence
# for model verification. This does not run the expensive forecast build.
[triggers]
crons = ["*/15 * * * *"]

# The scheduled collector parses one quality-controlled GLOS bulk response,
# NDBC's shared files and the small CO-OPS Great Lakes inventory. Map requests
# read the central R2 snapshot. A 50 ms ceiling leaves room for the scheduled
# parse; request limits below and the zone WAF remain denial-of-wallet controls.
[limits]
cpu_ms = 50

[[ratelimits]]
name = "MAP_IP_LIMITER"
namespace_id = "31001"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "MAP_ACCOUNT_LIMITER"
namespace_id = "31002"

  [ratelimits.simple]
  limit = 400
  period = 60

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "piercast-lake-map"
