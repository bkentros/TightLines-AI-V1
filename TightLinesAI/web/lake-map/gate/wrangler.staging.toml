# Manual staging target for gatekeeper changes. It intentionally has no custom
# route and no cron trigger, so it cannot replace production or duplicate the
# observation collector. Deploy with: npx wrangler@4 deploy -c wrangler.staging.toml
name = "piercast-map-gate-staging"
main = "worker.js"
account_id = "fe7a8d144a9b29b73dd513830858774c"
compatibility_date = "2026-09-01"
workers_dev = true

[limits]
cpu_ms = 50

[[ratelimits]]
name = "MAP_IP_LIMITER"
namespace_id = "31011"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "MAP_ACCOUNT_LIMITER"
namespace_id = "31012"

  [ratelimits.simple]
  limit = 400
  period = 60

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "piercast-lake-map"
