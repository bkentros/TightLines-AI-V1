# Scores immutable PierCast and captured Seagull forecast evidence against the
# centrally archived public observations. Research output only: it cannot alter
# a forecast or authorize a bias correction.
name: Lake map validation

on:
  schedule:
    # The prior UTC day is complete before this run starts.
    - cron: "25 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to re-evaluate (YYYY-MM-DD); blank means yesterday"
        type: string
        required: false
      scorecard_preflight_only:
        description: "Read and schema-check scorecard rows only; writes nothing"
        type: boolean
        default: false
        required: true
      scorecard_preflight_start:
        description: "Inclusive UTC start date for scorecard preflight"
        type: string
        required: false
      scorecard_preflight_end:
        description: "Inclusive UTC end date for scorecard preflight (maximum 31 days)"
        type: string
        required: false

concurrency:
  group: lake-map-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: inputs.scorecard_preflight_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: TightLinesAI/web/lake-map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - name: Install
        run: pip install -r job/requirements.txt
      - name: Test verifier
        run: python -m unittest job/tests/test_verification.py job/tests/test_seagull.py
      - name: Verify yesterday and publish
        if: github.event_name == 'schedule' || inputs.date == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
        run: python job/verify.py --upload --fail-on-pipeline-error
      - name: Verify requested date and publish
        if: github.event_name == 'workflow_dispatch' && inputs.date != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          VALIDATION_DATE: ${{ inputs.date }}
        run: python job/verify.py --upload --fail-on-pipeline-error --date "$VALIDATION_DATE"

  scorecard:
    if: vars.LAKE_MAP_SCORECARD_ENABLED == 'true' || inputs.scorecard_preflight_only == true
    continue-on-error: ${{ inputs.scorecard_preflight_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: TightLinesAI/web/lake-map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - name: Install
        run: pip install -r job/requirements.txt
      - name: Test private scorecard
        run: python -m unittest job/tests/test_verification.py job/tests/test_scorecard.py
      - name: Read-only production archive schema preflight
        if: github.event_name == 'workflow_dispatch' && inputs.scorecard_preflight_only == true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          PREFLIGHT_START: ${{ inputs.scorecard_preflight_start }}
          PREFLIGHT_END: ${{ inputs.scorecard_preflight_end }}
        run: python job/scorecard_job.py --preflight-start "$PREFLIGHT_START" --preflight-end "$PREFLIGHT_END"
      - name: Project private NOAA observation scorecard
        if: inputs.scorecard_preflight_only != true && (github.event_name == 'schedule' || inputs.date == '')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          LAKE_MAP_SCORECARD_ENABLED: ${{ vars.LAKE_MAP_SCORECARD_ENABLED }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LAKE_MAP_SCORECARD_INTERNAL_KEY: ${{ secrets.LAKE_MAP_SCORECARD_INTERNAL_KEY }}
        run: python job/scorecard_job.py --upload --sync
      - name: Project requested private NOAA observation scorecard
        if: inputs.scorecard_preflight_only != true && github.event_name == 'workflow_dispatch' && inputs.date != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          LAKE_MAP_SCORECARD_ENABLED: ${{ vars.LAKE_MAP_SCORECARD_ENABLED }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LAKE_MAP_SCORECARD_INTERNAL_KEY: ${{ secrets.LAKE_MAP_SCORECARD_INTERNAL_KEY }}
          VALIDATION_DATE: ${{ inputs.date }}
        run: python job/scorecard_job.py --upload --sync --date "$VALIDATION_DATE"
