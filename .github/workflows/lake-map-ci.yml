name: Lake map CI

on:
  # Keep the required check present on unrelated PRs; those pass without the
  # expensive suites after the path-detection step.
  pull_request:
  push:
    branches: [main]
    paths:
      - "TightLinesAI/web/lake-map/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lake-map-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lake-map-tests:
    name: lake-map-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect pipeline paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            TightLinesAI/web/lake-map \
            .github/workflows \
            .github/dependabot.yml; then
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.paths.outputs.affected == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - uses: actions/setup-node@v4
        if: steps.paths.outputs.affected == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: TightLinesAI/web/lake-map/package-lock.json
      - name: Install test dependencies
        if: steps.paths.outputs.affected == 'true'
        working-directory: TightLinesAI/web/lake-map
        run: pip install -r job/requirements.txt && npm ci
      - name: Full Python suite
        if: steps.paths.outputs.affected == 'true'
        working-directory: TightLinesAI/web/lake-map
        run: python -m unittest discover -s job/tests
      - name: Full Node suite
        if: steps.paths.outputs.affected == 'true'
        working-directory: TightLinesAI/web/lake-map
        run: node --test test/*.test.mjs job/*.test.mjs
      - name: Unrelated PR
        if: steps.paths.outputs.affected != 'true'
        run: echo "No lake-map pipeline paths changed; required check satisfied."

  canary:
    name: lake-map-dry-run-canary
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lake-map-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: TightLinesAI/web/lake-map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install data-job dependencies
        working-directory: TightLinesAI/web/lake-map
        run: pip install -r job/requirements.txt
      - name: Full lake-map dry run
        id: dry_run
        working-directory: TightLinesAI/web/lake-map
        run: python job/canary.py --out "$RUNNER_TEMP/lake-map-canary"
      - name: Alert immediately if the canary fails
        if: failure()
        env:
          PIPELINE_ALERT_TOKEN: ${{ secrets.PIPELINE_ALERT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const body = JSON.stringify({
              conclusion: "failure",
              runId: process.env.RUN_ID,
              job: "lake-map-dry-run-canary",
              step: "Full lake-map dry run",
              error: "The post-merge full NOAA build failed; inspect the linked workflow log.",
              url: process.env.RUN_URL,
            });
            const response = await fetch("https://finfindr-lake-map-alerts.finfindr.workers.dev/__pipeline/canary", {
              method: "POST",
              headers: {
                authorization: `Bearer ${process.env.PIPELINE_ALERT_TOKEN}`,
                "content-type": "application/json",
              },
              body,
            });
            if (!response.ok) throw new Error(`pipeline alert endpoint returned HTTP ${response.status}`);
          '
