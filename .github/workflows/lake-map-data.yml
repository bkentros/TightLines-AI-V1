# Builds the PierCast Live Lake Map frames from NOAA lake models (water temp),
# NOAA GLWU (waves), Open-Meteo (wind over the lakes) and NOAA GFS (wind for the
# wider map area), and publishes them to Cloudflare R2.
# Polls every 15 minutes while each NOAA model release is due; the build exits
# before paid APIs when a complete new release is not ready.
name: Lake map data

on:
  schedule:
    # NOAA's four Great Lakes OFS releases should finish around :40. Start at
    # :45 and poll every 15 minutes through :45 of the fifth hour after the
    # cycle timestamp. This leaves the next cycle to win when its window starts.
    # Discovery is free; build.py publishes only after all four models have the
    # identical complete cycle, at most once per cycle.
    - cron: "45 2,8,14,20 * * *"
    - cron: "0,15,30,45 3,4,5,9,10,11,15,16,17,21,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the current complete NOAA cycle"
        type: boolean
        default: false

concurrency:
  group: lake-map-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      surface_published: ${{ steps.surface.outputs.published }}
      surface_run: ${{ steps.surface.outputs.run }}
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/lake-map-data.yml
            /TightLinesAI/web/lake-map/
            !/TightLinesAI/web/lake-map/job/scorecard*.py
            !/TightLinesAI/web/lake-map/job/tests/test_scorecard*.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: TightLinesAI/web/lake-map/package-lock.json
      - name: Install
        run: pip install -r job/requirements.txt && npm ci
      - name: Verify scorecard isolation
        run: test -z "$(find job -type f \( -name 'scorecard*.py' -o -name 'test_scorecard*.py' \) -print -quit)"
      - name: Test
        run: python -m unittest discover -s job/tests && node --test test/*.test.mjs job/*.test.mjs
      - name: Build and publish
        id: publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python job/build.py --out "$RUNNER_TEMP/lakemap" --upload ${{ inputs.force && '--force' || '' }}
      - name: Record a completed surface publish
        id: surface
        run: |
          if [[ -f "$RUNNER_TEMP/lakemap/latest.json" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            python -c 'import json, os; print("run=" + json.load(open(os.environ["RUNNER_TEMP"] + "/lakemap/latest.json"))["run"])' >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  depth:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.surface_published == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/lake-map-data.yml
            TightLinesAI/web/lake-map
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - name: Install
        run: pip install -r job/requirements.txt
      - name: Build and publish Temp at depth
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
        run: python job/depth.py --out "$RUNNER_TEMP/lakemap-depth" --upload

  delivery:
    needs: [build, depth]
    if: always() && needs.build.result == 'success' && needs.build.outputs.surface_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/lake-map-data.yml
            TightLinesAI/web/lake-map/job/delivery.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify public surface and depth pointers
        env:
          PIER_CAST_MAP_PASS_SECRET: ${{ secrets.PIER_CAST_MAP_PASS_SECRET }}
        run: python job/delivery.py --run "${{ needs.build.outputs.surface_run }}" --timeout 120
