# Builds the PierCast Live Lake Map frames from NOAA lake models (water temp),
# NOAA GLWU (waves), Open-Meteo (wind over the lakes) and NOAA GFS (wind for the
# wider map area), and publishes them to Cloudflare R2.
# Polls every 15 minutes while each NOAA model release is due; the build exits
# before paid APIs when a complete new release is not ready.
name: Lake map data

on:
  schedule:
    # NOAA's four Great Lakes OFS releases should finish around :40. Start at
    # :45 and poll every 15 minutes for 75 more minutes so a delayed lake is
    # picked up quickly. Discovery is free; build.py publishes only after all
    # four models have the identical complete cycle, at most once per cycle.
    - cron: "45 2,8,14,20 * * *"
    - cron: "0,15,30,45 3,9,15,21 * * *"
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the current complete NOAA cycle"
        type: boolean
        default: false

concurrency:
  group: lake-map-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: TightLinesAI/web/lake-map
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/lake-map-data.yml
            /TightLinesAI/web/lake-map/
            !/TightLinesAI/web/lake-map/job/scorecard*.py
            !/TightLinesAI/web/lake-map/job/tests/test_scorecard*.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TightLinesAI/web/lake-map/job/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: TightLinesAI/web/lake-map/package-lock.json
      - name: Install
        run: pip install -r job/requirements.txt && npm ci
      - name: Verify scorecard isolation
        run: test -z "$(find job -type f \( -name 'scorecard*.py' -o -name 'test_scorecard*.py' \) -print -quit)"
      - name: Test
        run: python -m unittest discover -s job/tests && node --test test/*.test.mjs job/*.test.mjs
      - name: Build and publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: piercast-lake-map
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python job/build.py --out "$RUNNER_TEMP/lakemap" --upload ${{ inputs.force && '--force' || '' }}
