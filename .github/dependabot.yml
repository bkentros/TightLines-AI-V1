version: 2
updates:
  - package-ecosystem: npm
    directory: /TightLinesAI
    schedule:
      interval: weekly
      day: monday
    # Expo/React Native upgrades must be performed together through Expo's
    # compatibility tooling and native smoke tests. Disable routine npm version
    # PRs; Dependabot security-update PRs are not subject to this limit.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - pipeline
    groups:
      pipeline-actions:
        patterns:
          - "*"
    # Never auto-merge pipeline dependency updates. Dispatch Lake map CI on
    # the PR branch and verify its no-upload canary before merging.
